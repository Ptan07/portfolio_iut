name = "portfolio-iut"
main = "worker.js"
compatibility_date = "2025-09-01"
# Adresse publique https://portfolio-iut.tpopelka024.workers.dev
workers_dev = true

# Moteur GRATUIT : Cloudflare Workers AI (aucune clé à créer)
[ai]
binding = "AI"

[vars]
# Sites autorisés à interroger l'agent (séparés par des virgules).
# Ajoute "http://localhost:8000" pour tester en local.
ALLOWED_ORIGINS = "https://ptan07.github.io"
# Modèle Workers AI utilisé (gratuit dans la limite du quota quotidien)
CF_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
# Modèle Claude, utilisé seulement si tu ajoutes le secret ANTHROPIC_API_KEY
MODEL = "claude-haiku-5-5"

# 10 questions par minute et par adresse IP (protège ton quota gratuit)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# OPTIONNEL — passer sur Claude (payant, meilleures réponses) :
#   npx wrangler secret put ANTHROPIC_API_KEY
